<!doctype html>
<html data-zui-theme="holo" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>zProject</title>
<link rel="stylesheet" href="/zui/css/zui.css">
<link rel="stylesheet" href="/zui/css/themes/holo.css">
<script src="/zui/js/zui.js"></script>
<style>
  /* Responsive task layout layered entirely on the shared zUI Holo tokens.
     The 3px queue-row rail remains an information-bearing task-state cue. */
  :root{
    --bg:var(--zui-bg-app); --surface:var(--zui-bg-surface); --surface-2:var(--zui-bg-hover);
    --line:var(--zui-border); --line-strong:var(--zui-border-strong);
    --ink:var(--zui-text); --ink-2:var(--zui-text-secondary); --ink-3:var(--zui-text-disabled);
    --accent:var(--zui-accent); --accent-ink:var(--zui-accent); --accent-wash:var(--zui-accent-weak);
    --st-active:var(--zui-accent);
    --st-bug:var(--zui-error); --st-bug-wash:var(--zui-bg-surface);
    --st-err:var(--zui-error); --st-err-wash:var(--zui-bg-surface);
    --st-done:var(--zui-ok);
    --st-hold:var(--zui-text-disabled);
    --radius:var(--zui-radius);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 var(--zui-font);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--accent-ink); text-decoration:none}
  .muted{color:var(--ink-2)}

  /* ---- top bar ---- */
  .bar{
    position:sticky; top:0; z-index:10;
    background:var(--zui-bg-surface-alt); border-bottom:1px solid var(--zui-accent);
    display:flex; align-items:center; gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    min-height:52px;
  }
  .bar .lead{
    font:inherit; background:none; border:0; padding:0; cursor:pointer;
    color:var(--accent-ink); font-size:15px; display:flex; align-items:center; gap:4px;
  }
  .bar h1{font-size:var(--zui-fs-medium); font-weight:var(--zui-fw-medium); margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar .act{
    font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--zui-bg-raised);
    color:var(--ink); border-radius:var(--radius); padding:7px 13px; min-height:36px;
  }
  .bar .act:hover{background:var(--zui-bg-hover)}
  .bar .act.primary{background:var(--accent-wash); border-color:var(--accent); color:var(--accent)}
  .bar .act:disabled{opacity:.5}

  main{max-width:720px; margin:0 auto}
  .pad{padding:14px}

  /* ---- project picker ---- */
  .plist{background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .prow{display:block; padding:13px 14px; border-bottom:1px solid var(--line); color:inherit}
  .prow:last-child{border-bottom:0}
  .prow:hover,.prow:active{background:var(--surface-2)}
  .prow .nm{font-weight:600}
  .prow .sub{color:var(--ink-2); font-size:12.5px; margin-top:2px}
  .prow .sub .n{color:var(--ink)}

  /* ---- queue list ---- */
  .grp{
    font-size:var(--zui-fs-small); font-weight:var(--zui-fw-medium); color:var(--zui-label-color);
    padding:16px 14px 5px; text-transform:uppercase; letter-spacing:.08em;
    border-bottom:1px solid var(--zui-accent);
  }
  .grp .c{color:var(--ink-3); font-weight:400}
  .branch-lock{margin-left:auto; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2); border-radius:var(--radius); padding:4px 8px; font:inherit; font-size:12px}
  .branch-order{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2); border-radius:var(--radius); width:28px; height:28px; font:inherit; cursor:pointer}
  .branch-order:disabled{opacity:.35; cursor:default}
  .queue{background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .q{
    display:flex; align-items:center; gap:10px;
    padding:11px 14px 11px 11px; border-bottom:1px solid var(--line);
    border-left:3px solid var(--st-active); cursor:pointer; min-height:44px;
  }
  .q:last-child{border-bottom:0}
  .q:hover,.q:active{background:var(--surface-2)}
  .q.s-priority{border-left-color:var(--st-bug); background:color-mix(in srgb,var(--st-bug) 24%,var(--surface))}
  .q.s-bug{border-left-color:var(--st-bug); background:var(--st-bug-wash)}
  .q.s-err{border-left-color:var(--st-err); background:var(--st-err-wash)}
  .q.s-done{border-left-color:var(--st-done)}
  .q.s-hold{border-left-color:var(--st-hold)}
  .q.note{align-items:flex-start; background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
  .q.stop{background:color-mix(in srgb,var(--st-hold) 16%,var(--surface)); border-left-color:var(--st-hold); cursor:default}
  .qstop{flex:1; min-width:0; color:var(--st-hold); font-weight:700; letter-spacing:.04em}
  .qstop small{display:block; margin-top:3px; color:var(--ink-2); font-weight:400; letter-spacing:0}
  .stop-remove{border:1px solid var(--line-strong); background:var(--surface); color:var(--st-err); border-radius:var(--radius); padding:5px 8px; font:inherit; font-size:12px; cursor:pointer}
  .qmain{flex:1; min-width:0}
  .qmain .nm{display:block; font-weight:600}
  .qpreview{color:var(--ink-2); font-size:12.5px; margin-top:3px; display:grid; gap:2px}
  .qpreview div{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; white-space:pre-line; overflow-wrap:anywhere}
  .qpreview b{color:var(--ink); font-weight:600; margin-right:4px}
  .qnote{flex:1; min-width:0}
  .qnote .nm{display:block; font-weight:600}
  .qnote .body{color:var(--ink-2); font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:5.8em; overflow:auto; margin-top:3px}
  .qimg{width:62px; height:46px; flex:none; object-fit:cover; border:1px solid var(--line); background:var(--bg)}
  .q .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .q.s-done .nm, .q.s-arch .nm{text-decoration:line-through; color:var(--ink-2)}
  .q .rt{font-size:12px; color:var(--ink-2); white-space:nowrap; display:flex; align-items:center; gap:8px}
  .q .state{color:var(--st-active)}
  .q.s-bug .state{color:var(--st-bug)} .q.s-err .state{color:var(--st-err)}
  .q.s-done .state{color:var(--st-done)} .q.s-hold .state{color:var(--st-hold)}
  .q .prog{font-variant-numeric:tabular-nums}
  .empty{padding:24px 14px; color:var(--ink-2)}

  /* ---- task page ---- */
  .field{padding:12px 14px 0}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
  .field input[type=text], .field select, .field textarea{
    width:100%; font:inherit; font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
    padding:9px 10px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent)}
  .field textarea{min-height:78px; resize:vertical; line-height:1.45}
  .field.big textarea{min-height:120px}
  .two{display:flex; gap:10px}
  .two .field{flex:1; padding-left:0; padding-right:0}
  .two{padding:12px 14px 0}

  .flags{display:flex; flex-wrap:wrap; gap:7px; padding:14px 14px 4px}
  .flag{
    font:inherit; font-size:13px; cursor:pointer;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
    border-radius:var(--radius); padding:7px 11px; min-height:34px;
  }
  .flag[aria-pressed=true]{background:var(--accent-wash); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
  .flag.warn[aria-pressed=true]{background:var(--st-err-wash); border-color:var(--st-err); color:var(--st-err)}
  .flag.bug[aria-pressed=true]{background:var(--st-bug-wash); border-color:var(--st-bug); color:var(--st-bug)}
  .flag.priority[aria-pressed=true]{background:color-mix(in srgb,var(--st-bug) 24%,var(--surface)); border-color:var(--st-bug); color:var(--st-bug)}

  .subhead{font-size:12.5px; font-weight:600; color:var(--ink-2); padding:18px 14px 0}
  .subs{padding:6px 14px 0; max-height:280px; overflow-y:auto}
  .sub{display:flex; align-items:center; gap:9px; padding:5px 0}
  .sub input[type=checkbox]{width:20px; height:20px; flex:none}
  input[type=checkbox]{accent-color:var(--zui-accent)}
  .sub .tx{flex:1}
  .sub input.tx{min-width:0; font:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius); padding:6px 8px}
  .sub .tx.done{text-decoration:line-through; color:var(--ink-2)}
  .sub-add{display:flex; gap:8px; padding:8px 14px 0}
  .sub-add input{flex:1; font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--surface)}
  .sub-add button{font:inherit; border:1px solid var(--line-strong); background:var(--surface); border-radius:var(--radius); padding:0 14px; cursor:pointer}
  .attachments{padding:6px 14px 0; display:flex; flex-direction:column; gap:5px}
  .attachment{display:flex; align-items:center; gap:9px; min-height:34px; overflow:hidden}
  .attachment a{display:flex; align-items:center; gap:9px; color:var(--accent); min-width:0; flex:1; overflow:hidden}
  .attachment img{width:48px; height:36px; object-fit:cover; border:1px solid var(--line); flex:none}
  .attachment span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .attachment button{flex:none; padding:5px 8px}
  .attach-help{font-size:11px; color:var(--muted); margin-top:5px}

  .disclose{font:inherit; font-size:13px; color:var(--accent-ink); background:none; border:0; padding:14px; cursor:pointer}
  .danger{font:inherit; font-size:13px; color:var(--st-err); background:none; border:0; padding:18px 14px; cursor:pointer}

  .actionbar{
    position:sticky; bottom:0; margin-top:20px;
    background:var(--bg); border-top:1px solid var(--line-strong);
    display:flex; gap:10px; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .actionbar button{
    flex:1; font:inherit; font-size:15px; font-weight:600; min-height:44px;
    border:1px solid var(--line-strong); border-radius:var(--radius); background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .actionbar .save{background:var(--accent-wash); border-color:var(--accent); color:var(--accent); flex:2}
  .actionbar button:hover,.sub-add button:hover{background:var(--zui-bg-hover)}
  .actionbar button:disabled{opacity:.55}

  /* one deliberate motion: the list <-> task slide */
  .view{animation:slide .16s ease-out}
  @keyframes slide{from{opacity:.4; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .view{animation:none} }
  @media (max-width:480px){
    .two{flex-direction:column; gap:0}
    .bar{gap:8px}
    .q .rt{gap:4px}
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--zui-bg-raised); color:var(--zui-text); border:1px solid var(--zui-border-strong); font-size:13px; padding:9px 14px; border-radius:var(--radius);
    z-index:30; max-width:90%;
  }
  .toast.err{background:var(--st-err); color:var(--zui-on-danger); border-color:var(--st-err)}

  footer{max-width:720px; margin:22px auto 34px; padding:0 14px; color:var(--ink-3); font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<footer id="foot"></footer>

<script>
"use strict";
const app = document.getElementById('app');
const foot = document.getElementById('foot');
let cache = { pi: -1, data: null };   // last-loaded project payload
let busy = false;

const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av  = s => esc(s).replace(/'/g,'&#39;');

/* deterministic pale tag colour (mirrors the desktop app) */
function tagColor(tag){
  let h = 2166136261 >>> 0;
  for (const ch of tag.toLowerCase()) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const hue = h % 360;
  return `hsl(${hue} 42% 88%)`;
}

/* ---- routing: #  |  #<pi>  |  #<pi>/<taskId|new> ---- */
function route(){
  const raw = location.hash.replace(/^#\/?/, '');
  if (!raw) return { view:'picker' };
  const [pi, tid] = raw.split('/');
  if (!/^\d+$/.test(pi)) return { view:'picker' };
  return tid ? { view:'task', pi:+pi, tid } : { view:'list', pi:+pi };
}
function goPicker(){ location.hash = ''; }
function goList(pi){ location.hash = '#' + pi; }
function goTask(pi, tid){ location.hash = '#' + pi + '/' + tid; }
window.addEventListener('hashchange', render);

/* ---- operator ---- */
async function op(command, ...args){
  if (busy) return { ok:false, message:'one change at a time' };
  busy = true;
  try{
    const r = await fetch('/api/op', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ command, args: args.map(String) }),
    });
    const j = await r.json().catch(() => ({ ok:false, message:'no response' }));
    return j;
  }catch(e){
    return { ok:false, message:e.message };
  }finally{ busy = false; }
}
function toast(msg, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 4500 : 1800);
}

async function getProject(pi, forceReload = false){
  if (!forceReload && cache.pi === pi && cache.data) return cache.data;
  const data = await (await fetch('/api/project/' + pi)).json();
  cache = { pi, data };
  return data;
}

/* ---- render ---- */
async function render(){
  const r = route();
  try{
    if (r.view === 'picker') return renderPicker();
    if (r.view === 'list')   return renderList(r.pi);
    if (r.view === 'task')   return renderTask(r.pi, r.tid);
  }catch(e){
    app.innerHTML = `<div class="pad muted">Could not load. ${esc(e.message)}</div>`;
  }
}

async function renderPicker(){
  const data = await (await fetch('/api/projects')).json();
  const rows = data.projects.map(p => `
    <a class="prow" href="#${p.index}">
      <div class="nm">${esc(p.name)}</div>
      <div class="sub"><span class="n">${p.open}</span> open · ${p.done} done · ${p.total} total</div>
    </a>`).join('') || '<div class="empty">No projects yet. Add one below.</div>';
  app.innerHTML = `
    <div class="bar"><h1>zProject</h1>
      <button class="act primary" id="np">New project</button></div>
    <main class="view">
      <div class="plist">${rows}</div>
      <div class="pad"><button class="act" id="nl">New local list</button></div>
    </main>`;
  document.getElementById('np').onclick = newProject;
  document.getElementById('nl').onclick = () => newProject(true);
  foot.textContent = `${data.projects.length} project(s)`;
}

async function newProject(local){
  const name = (prompt(local ? 'Name for the local to-do list:' : 'New project name:') || '').trim();
  if (!name) return;
  const r = await op(local ? 'new_local_project' : 'new_project', name);
  r.ok ? render() : toast(r.message, true);
}

function branchColor(name){
  const str = (name || 'main').trim().toLowerCase();
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  }
  const hue = Math.abs(h % 360);
  return `hsl(${hue}, 65%, 55%)`;
}

const SECT_CLASS = { 'Bugs':'s-bug','Needs attention':'s-err','Completed':'s-done','Archived':'s-arch' };

async function renderList(pi){
  // Opening a task list is an explicit refresh boundary. Bypass the page cache
  // every time; the API re-reads tasks.xml/archive.xml before responding.
  const data = await getProject(pi, true);
  const groups = new Map();
  for (const t of data.tasks){
    (groups.get(t.sectionKey) || groups.set(t.sectionKey, []).get(t.sectionKey)).push(t);
  }
  let body = '';
  // Categorize like branches together; new branch = new category (ZP-83)
  const branchNames = [];
  for (const t of data.tasks){
    if (t.sectionKey !== 'Completed' && t.sectionKey !== 'Archived'){
      if (!branchNames.includes(t.sectionKey)) branchNames.push(t.sectionKey);
    }
  }
  branchNames.sort((a,b) => {
    const ai = data.branches.findIndex(branch => branch.toLowerCase() === a.toLowerCase());
    const bi = data.branches.findIndex(branch => branch.toLowerCase() === b.toLowerCase());
    return ai - bi;
  });

  for (const b of branchNames){
    const items = groups.get(b) || [];
    const lockable = items.filter(t => !t.done && !t.archived && !t.isStop);
    const allLocked = lockable.length > 0 && lockable.every(t => t.locked);
    const branchIndex = data.branches.findIndex(branch => branch.toLowerCase() === b.toLowerCase());
    body += `<div class="grp" style="display:flex;align-items:center;gap:6px;">
      <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${branchColor(b)};flex:none;"></span>
      <span>${esc(b)}</span> <span class="c">${items.length}</span>
      <button class="branch-order" data-branch-move data-branch="${av(b)}" data-direction="up" title="Move branch earlier" ${branchIndex <= 0 ? 'disabled' : ''}>&#8593;</button>
      <button class="branch-order" data-branch-move data-branch="${av(b)}" data-direction="down" title="Move branch later" ${branchIndex === data.branches.length - 1 ? 'disabled' : ''}>&#8595;</button>
      <button class="branch-lock" data-branch-lock data-branch="${av(b)}" data-locked="${!allLocked}">${allLocked ? 'Unlock' : 'Lock'} branch</button>
    </div><div class="queue">`;
    for (const t of items) body += row(pi, t);
    body += `</div>`;
  }

  for (const key of ['Completed', 'Finished Today', 'Archived']){
    const items = groups.get(key);
    if (!items || !items.length) continue;
    body += `<div class="grp">${esc(key)} <span class="c">${items.length}</span></div><div class="queue">`;
    for (const t of items) body += row(pi, t);
    body += `</div>`;
  }
  if (!data.tasks.length) body = '<div class="empty">No tasks yet. Add the first one.</div>';

  app.innerHTML = `
    <div class="bar">
      <button class="lead" onclick="goPicker()">‹ Projects</button>
      <h1>${esc(data.name)}</h1>
      <button class="act" id="nn">New note</button>
      <button class="act" id="ns">Stop execution</button>
      <button class="act" id="nb">New branch</button>
      <button class="act" id="csv">Export CSV</button>
      <button class="act" id="csvImport">Import CSV</button>
      <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
      <button class="act primary" id="nt">New task</button>
    </div>
    <main class="view">${body}</main>`;
  document.getElementById('nt').onclick = () => goTask(pi, 'new');
  document.getElementById('nn').onclick = () => goTask(pi, 'new-note');
  document.getElementById('ns').onclick = async () => {
    const result = await op('new_stop', data.directory);
    if (!result.ok) toast(result.message, true);
    cache.data = null;
    await renderList(pi);
  };
  document.getElementById('nb').onclick = async () => {
    const name = prompt('Name for the new branch:');
    if (name === null) return;
    const result = await op('branch_add', data.directory, name.trim());
    toast(result.message, !result.ok);
    cache.data = null;
    await renderList(pi);
  };
  document.getElementById('csv').onclick = () => { window.location.href = `/api/project/${pi}/export.csv`; };
  const csvFile = document.getElementById('csvFile');
  document.getElementById('csvImport').onclick = () => csvFile.click();
  csvFile.onchange = async () => {
    const file = csvFile.files && csvFile.files[0];
    if (!file) return;
    const button = document.getElementById('csvImport');
    button.disabled = true;
    const response = await fetch(`/api/project/${pi}/import.csv`, {
      method:'POST', headers:{'Content-Type':'text/csv; charset=utf-8'}, body:file,
    });
    const result = await response.json().catch(() => ({ok:false, message:'CSV import failed'}));
    toast(result.message || 'CSV import finished', !response.ok);
    csvFile.value = ''; button.disabled = false;
    cache.data = null;
    await renderList(pi);
  };
  app.querySelectorAll('.q:not(.stop)').forEach(el => el.onclick = () => goTask(pi, el.dataset.id));
  app.querySelectorAll('[data-remove-stop]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    if (!confirm('Remove this stop-execution marker?')) return;
    const result = await op('delete', el.dataset.removeStop);
    if (!result.ok) toast(result.message, true);
    cache.data = null;
    await renderList(pi);
  });
  app.querySelectorAll('[data-branch-lock]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    el.disabled = true;
    const r = await op('branch_lock', data.directory, el.dataset.branch, el.dataset.locked);
    if (!r.ok) toast(r.message, true);
    await renderList(pi);
  });
  app.querySelectorAll('[data-branch-move]').forEach(el => el.onclick = async e => {
    e.stopPropagation();
    if (el.disabled) return;
    el.disabled = true;
    const r = await op('branch_move', data.directory, el.dataset.branch, el.dataset.direction);
    if (!r.ok) toast(r.message, true);
    cache.data = null;
    await renderList(pi);
  });
  foot.textContent = `${esc(data.directory)} · ${data.tasks.length} task(s)`;
}

function row(pi, t){
  const sc = t.priority && !t.done && !t.archived ? 's-priority' : (SECT_CLASS[t.sectionKey] || 's-active');
  const state = t.inProgress ? 'in progress' : (t.done ? 'done' : t.statusText.toLowerCase());
  const prog = (t.subtasks && t.subtasks.length)
    ? `<span class="prog">${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</span>` : '';
  const branchBanner = t.branch ? `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${branchColor(t.branch)};margin-right:6px;flex:none;" title="Branch: ${esc(t.branch)}"></span>` : '';
  let preview = '';
  if (!t.isNote && !t.isStop && (t.prompt || t.requirements)) {
    preview = '<span class="qpreview">';
    if (t.prompt) preview += `<div title="${av(t.prompt)}"><b>Prompt</b>${esc(t.prompt)}</div>`;
    if (t.requirements) preview += `<div title="${av(t.requirements)}"><b>Requirements</b>${esc(t.requirements)}</div>`;
    preview += '</span>';
  }
  return `<div class="q ${sc}${t.isNote ? ' note' : ''}${t.isStop ? ' stop' : ''}" data-id="${av(t.id)}">
    ${branchBanner}
    ${t.isStop ? `<span class="qstop">STOP EXECUTION<small>Agent processing stops here and awaits instructions</small></span><button class="stop-remove" data-remove-stop="${av(t.id)}">Remove</button>` : t.isNote ? `<span class="qnote"><span class="nm">${esc(t.displayName)}</span><span class="body">${esc(t.note || '')}</span></span>` : `<span class="qmain"><span class="nm">${esc(t.displayName)}</span>${preview}</span>`}
    <span class="rt">${prog}<span class="state">${esc(state)}</span></span>
    ${!t.isNote && !t.isStop && t.imageUrl ? `<img class="qimg" src="${av(t.imageUrl)}" alt="Attached image">` : ''}
  </div>`;
}

/* ---- task page ---- */
const BLANK = { id:'', name:'', prompt:'', requirements:'', tags:[], blockedBy:'',
  dateStarted:'', dueDate:'', dateFinished:'', notes:'', filesChanged:'', errorMessage:'',
  isNote:false, note:'', clearAfterReading:false,
  priority:false, bug:false, done:false, inProgress:false, locked:false, error:false, archived:false,
  commit:false, build:false, release:false, merge:false, branch:'main', subtasks:[], attachments:[] };

async function renderTask(pi, tid){
  const isNewNote = tid === 'new-note';
  const isNew = tid === 'new' || isNewNote;
  let t = JSON.parse(JSON.stringify(BLANK)), pname = '';
  t.isNote = isNewNote;
  const data = await getProject(pi).catch(() => null);
  if (data) pname = data.name;
  if (isNew && data) t.branch = data.defaultBranch || 'main';
  if (!isNew){
    const found = data && data.tasks.find(x => x.id === tid);
    if (!found){ app.innerHTML = '<div class="pad muted">That task is gone. <a href="#' + pi + '">Back to the list</a></div>'; return; }
    t = JSON.parse(JSON.stringify(found));   // edit a copy — the list cache stays clean until Save
  }
  const orig = JSON.parse(JSON.stringify(t));
  if (t.isNote) return renderNote(pi, pname, isNew, t, orig, data?.branches || ['main']);
  const flag = (k,label,cls='') =>
    `<button class="flag ${cls}" data-f="${k}" aria-pressed="${!!t[k]}"
      ${k === 'done' && t.mergeBlocked ? 'disabled title="Finish remaining branch tasks first"' : ''}>${label}</button>`;
  const agentOpen = t.notes || t.filesChanged || t.errorMessage;

  app.innerHTML = `
    <div class="bar">
      <button class="lead" id="back">‹ ${isNew ? 'Cancel' : esc(data ? data.name : 'Back')}</button>
      <h1>${isNew ? 'New task' : esc(t.id)}</h1>
    </div>
    <main class="view">
      <div class="field"><label for="f_name">Name</label>
        <input type="text" id="f_name" value="${av(t.name)}" placeholder="Short title"></div>
      <div class="field big"><label for="f_prompt">Prompt</label>
        <textarea id="f_prompt" placeholder="What the agent should do">${esc(t.prompt)}</textarea></div>
      <div class="field"><label for="f_requirements">Requirements</label>
        <textarea id="f_requirements" placeholder="What must be true when it's done">${esc(t.requirements)}</textarea></div>
      <div class="subhead">Attachments</div>
      <div class="attachments" id="taskAttachments">${attachmentRows(t.attachments || [])}</div>
      <div class="field">
        <label for="f_attachments">Add files</label>
        <input type="file" id="f_attachments" multiple
          accept=".png,.jpg,.jpeg,.gif,.bmp,.webp,.zscript,.zsheet,.csv,.txt,.docx,.pdf" ${isNew ? 'disabled' : ''}>
        <div class="attach-help">${isNew ? 'Save the task before adding files.' : 'Up to 25 MB each. Images show a preview; other files download securely.'}</div>
      </div>
      <div class="field"><label for="f_branch">Branch</label>
        <select id="f_branch">${branchOptions(data?.branches, t.branch)}</select></div>
      <div class="field"><label for="f_tags">Tags</label>
        <input type="text" id="f_tags" value="${av((t.tags||[]).join(', '))}" placeholder="comma, separated"></div>
      <div class="two">
        <div class="field" style="padding-top:0"><label for="f_blockedBy">Blocked by</label>
          <input type="text" id="f_blockedBy" value="${av(t.blockedBy)}" placeholder="task id"></div>
        <div class="field" style="padding-top:0"><label for="f_dueDate">Due</label>
          <input type="text" id="f_dueDate" value="${av(t.dueDate)}" placeholder="YYYY-MM-DD HH:mm"></div>
      </div>

      <div class="flags">
        ${flag('priority','Priority','priority')}
        ${flag('bug','Bug','bug')}
        ${flag('inProgress','In progress')}
        ${flag('done','Done')}
        ${flag('locked','Locked')}
        ${flag('commit','Commit')}
        ${flag('build','Build')}
        ${flag('release','Release')}
        ${flag('merge','Merge')}
        ${flag('error','Error','warn')}
        ${flag('archived','Archived')}
      </div>
      ${t.mergeBlocked ? `<div class="field"><div class="muted">Merge blocked by ${t.mergeBlockerCount} unfinished task(s) in this branch.</div></div>` : ''}

      <div class="subhead">Subtasks</div>
      <div class="subs" id="subs">
        ${(t.subtasks||[]).map((s,i) => `
          <div class="sub" data-i="${i}">
            <input type="checkbox" ${s.done ? 'checked' : ''}>
            <input type="text" class="tx ${s.done ? 'done' : ''}" value="${av(s.text)}" data-original="${av(s.text)}" aria-label="Subtask text">
          </div>`).join('') || '<div class="muted" style="padding:2px 0">None yet.</div>'}
      </div>
      <div class="sub-add">
        <input type="text" id="f_newsub" placeholder="Add a subtask">
        <button id="addsub">Add</button>
      </div>

      <button class="disclose" id="agentToggle">${agentOpen ? 'Hide' : 'Show'} agent output &amp; dates</button>
      <div id="agent" ${agentOpen ? '' : 'hidden'}>
        <div class="field" style="padding-top:0"><label for="f_dateStarted">Date started</label>
          <input type="text" id="f_dateStarted" value="${av(t.dateStarted)}" placeholder="YYYY-MM-DD HH:mm"></div>
        <div class="field"><label for="f_dateFinished">Date finished</label>
          <input type="text" id="f_dateFinished" value="${av(t.dateFinished)}" placeholder="YYYY-MM-DD HH:mm"></div>
        <div class="field"><label for="f_notes">Notes</label>
          <textarea id="f_notes">${esc(t.notes)}</textarea></div>
        <div class="field"><label for="f_filesChanged">Files changed</label>
          <textarea id="f_filesChanged">${esc(t.filesChanged)}</textarea></div>
        <div class="field"><label for="f_errorMessage">Error message</label>
          <input type="text" id="f_errorMessage" value="${av(t.errorMessage)}"></div>
      </div>

      ${isNew ? '' : '<button class="danger" id="del">Delete this task</button>'}

      <div class="actionbar">
        <button id="cancel">Cancel</button>
        <button class="save" id="save">${isNew ? 'Create task' : 'Save'}</button>
      </div>
    </main>`;

  const nav = () => isNew ? goList(pi) : goList(pi);
  document.getElementById('back').onclick = nav;
  document.getElementById('cancel').onclick = nav;

  app.querySelectorAll('.flag').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    t[b.dataset.f] = !on;
  });
  bindTaskAttachments(pi, t, isNew);
  document.getElementById('agentToggle').onclick = e => {
    const box = document.getElementById('agent');
    box.hidden = !box.hidden;
    e.target.textContent = (box.hidden ? 'Show' : 'Hide') + ' agent output & dates';
  };
  app.querySelectorAll('#subs .sub input').forEach(cb => cb.onchange = () => {
    if (cb.type === 'checkbox') cb.nextElementSibling.classList.toggle('done', cb.checked);
  });
  app.querySelectorAll('#subs .sub input.tx').forEach(input => input.onblur = () => {
    if (!input.value.trim()) input.value = input.dataset.original;
  });
  document.getElementById('addsub').onclick = () => {
    const inp = document.getElementById('f_newsub');
    const v = inp.value.trim();
    if (!v) return;
    const wrap = document.getElementById('subs');
    if (wrap.querySelector('.muted')) wrap.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'sub'; d.dataset.new = '1';
    d.innerHTML = `<input type="checkbox" disabled><input type="text" class="tx" value="${av(v)}" data-original="${av(v)}" aria-label="Subtask text">`;
    wrap.appendChild(d);
    inp.value = '';
  };
  if (!isNew) document.getElementById('del').onclick = async () => {
    if (!confirm('Delete ' + t.id + '?')) return;
    const r = await op('delete', t.id);
    if (r.ok){ cache.data = null; toast('Deleted ' + t.id); goList(pi); }
    else toast(r.message, true);
  };
  document.getElementById('save').onclick = () => saveTask(pi, pname, isNew, t, orig);
  if (isNew) document.getElementById('f_name').focus();
}

function attachmentRows(attachments){
  if (!attachments.length) return '<div class="muted">No attachments.</div>';
  return attachments.map(a => `<div class="attachment" data-attachment="${av(a.name)}">
    <a href="${av(a.url)}" target="_blank" rel="noopener">${a.isImage ? `<img src="${av(a.url)}" alt="">` : ''}<span>${esc(a.name)}</span></a>
    <button type="button" data-remove-attachment="${av(a.name)}">Remove</button>
  </div>`).join('');
}

function bindTaskAttachments(pi, t, isNew){
  if (isNew) return;
  const list = document.getElementById('taskAttachments');
  const input = document.getElementById('f_attachments');
  const redraw = () => {
    list.innerHTML = attachmentRows(t.attachments || []);
    list.querySelectorAll('[data-remove-attachment]').forEach(button => button.onclick = async () => {
      button.disabled = true;
      const name = button.dataset.removeAttachment;
      const url = `/api/project/${pi}/attachment/${encodeURIComponent(t.id)}/${encodeURIComponent(name)}`;
      const response = await fetch(url, {method:'DELETE'});
      if (!response.ok){
        const result = await response.json().catch(() => ({message:'Could not remove attachment'}));
        toast(result.message || 'Could not remove attachment', true); button.disabled = false; return;
      }
      t.attachments = (t.attachments || []).filter(a => a.name !== name);
      cache.data = null; redraw(); toast('Attachment removed');
    });
  };
  redraw();
  input.onchange = async () => {
    const files = Array.from(input.files || []);
    if (!files.length) return;
    input.disabled = true;
    for (const file of files){
      const url = `/api/project/${pi}/attachment/${encodeURIComponent(t.id)}/${encodeURIComponent(file.name)}`;
      const response = await fetch(url, {method:'POST', headers:{'Content-Type':file.type || 'application/octet-stream'}, body:file});
      const result = await response.json().catch(() => ({ok:false, message:'Upload failed'}));
      if (!response.ok || !result.ok){ toast(result.message || `Could not upload ${file.name}`, true); continue; }
      const name = result.name;
      const attachmentUrl = `/api/project/${pi}/attachment/${encodeURIComponent(t.id)}/${encodeURIComponent(name)}`;
      t.attachments = t.attachments || [];
      t.attachments.push({name, url:attachmentUrl, isImage:/\.(png|jpe?g|gif|bmp|webp)$/i.test(name)});
    }
    cache.data = null; input.value = ''; input.disabled = false; redraw();
  };
}

function branchOptions(branches, current){
  const selected = current || 'main';
  const options = Array.from(new Set([...(branches || ['main']), selected]));
  return options.map(branch => `<option value="${av(branch)}"${branch === selected ? ' selected' : ''}>${esc(branch)}</option>`).join('');
}

function renderNote(pi, pname, isNew, t, orig, branches){
  app.innerHTML = `
    <div class="bar">
      <button class="lead" id="back">‹ ${isNew ? 'Cancel' : esc(pname || 'Back')}</button>
      <h1>${isNew ? 'New note' : esc(t.id)}</h1>
    </div>
    <main class="view">
      <div class="field"><label for="n_name">Name</label>
        <input type="text" id="n_name" value="${av(t.name)}" placeholder="Short title"></div>
      <div class="field big"><label for="n_note">Note</label>
        <textarea id="n_note" placeholder="Information for the agent">${esc(t.note || '')}</textarea></div>
      <div class="field"><label for="n_branch">Branch</label>
        <select id="n_branch">${branchOptions(branches, t.branch)}</select></div>
      <div class="field">
        <label><input type="checkbox" id="n_done" ${t.done ? 'checked' : ''}> Done</label>
        <label><input type="checkbox" id="n_clear" ${t.clearAfterReading ? 'checked' : ''}> Clear after reading</label>
      </div>
      ${isNew ? '' : '<button class="danger" id="del">Delete this note</button>'}
      <div class="actionbar"><button id="cancel">Cancel</button><button class="save" id="save">${isNew ? 'Create note' : 'Save'}</button></div>
    </main>`;
  const back = () => goList(pi);
  document.getElementById('back').onclick = back;
  document.getElementById('cancel').onclick = back;
  if (!isNew) document.getElementById('del').onclick = async () => {
    if (!confirm('Delete ' + t.id + '?')) return;
    const r = await op('delete', t.id);
    if (r.ok){ cache.data = null; toast('Deleted ' + t.id); goList(pi); } else toast(r.message, true);
  };
  document.getElementById('save').onclick = async () => {
    const name = document.getElementById('n_name').value.trim();
    const note = document.getElementById('n_note').value;
    const branch = document.getElementById('n_branch').value.trim() || 'main';
    const done = document.getElementById('n_done').checked;
    const clear = document.getElementById('n_clear').checked;
    let id = t.id;
    const created = isNew ? await op('new_note', pname, name || '(note)', note) : {ok:true};
    if (!created.ok){ toast(created.message, true); return; }
    if (isNew) id = (created.output || '').trim();
    const saved = await op('sync_many', id, 'name', name, 'note', note, 'branch', branch, 'done', done, 'clearAfterReading', clear);
    if (!saved.ok){ toast(saved.message, true); return; }
    if (isNew) await op('branch_default', pname, branch);
    cache.data = null; toast(isNew ? 'Note created' : 'Saved'); goList(pi);
  };
  document.getElementById(isNew ? 'n_name' : 'n_note').focus();
}

async function saveTask(pi, pname, isNew, t, orig){
  const g = id => document.getElementById(id);
  const val = id => g(id) ? g(id).value.trim() : '';
  const text = {
    name: val('f_name'), prompt: g('f_prompt').value, requirements: g('f_requirements').value,
    branch: val('f_branch') || 'main',
    tags: val('f_tags').split(',').map(s=>s.trim()).filter(Boolean).join(', '),
    blockedBy: val('f_blockedBy'), dueDate: val('f_dueDate'),
    dateStarted: val('f_dateStarted'), notes: g('f_notes') ? g('f_notes').value : orig.notes,
    dateFinished: val('f_dateFinished'),
    filesChanged: g('f_filesChanged') ? g('f_filesChanged').value : orig.filesChanged,
    errorMessage: g('f_errorMessage') ? val('f_errorMessage') : orig.errorMessage,
  };
  const BOOLS = ['priority','bug','inProgress','done','locked','commit','build','release','merge','error','archived'];

  const btn = g('save'); btn.disabled = true; btn.textContent = 'Saving…';

  let id = t.id;
  if (isNew){
    const r = await op('new_task', pname, text.name || '(new task)', text.prompt || '');
    if (!r.ok){ toast(r.message, true); btn.disabled = false; btn.textContent = 'Create task'; return; }
    id = (r.output || '').trim();
  }

  const pairs = [];
  const put = (k,v) => { pairs.push(k, String(v)); };
  if (!isNew){ put('name', text.name); put('prompt', text.prompt); }
  put('branch', text.branch);
  put('requirements', text.requirements);
  put('tags', text.tags);
  put('blockedBy', text.blockedBy);
  put('dueDate', text.dueDate);
  put('dateStarted', text.dateStarted);
  put('dateFinished', text.dateFinished);
  put('notes', text.notes);
  put('filesChanged', text.filesChanged);
  put('errorMessage', text.errorMessage);
  for (const k of BOOLS) put(k, !!t[k]);

  const r2 = await op('sync_many', id, ...pairs);
  if (!r2.ok && !isNew){ toast(r2.message, true); btn.disabled = false; btn.textContent = 'Save'; return; }
  if (isNew) await op('branch_default', pname, text.branch);

  /* subtasks: toggled dones + newly added rows */
  const rows = [...document.querySelectorAll('#subs .sub')];
  for (let i = 0; i < rows.length; i++){
    const el = rows[i];
    if (el.dataset.new){
      const newText = el.querySelector('.tx').value.trim();
      if (newText) await op('new_subtask', id, newText);
    } else {
      const nowText = el.querySelector('.tx').value.trim();
      if (orig.subtasks[i] && nowText && orig.subtasks[i].text !== nowText)
        await op('subtask_text', id, i, nowText);
      const nowDone = el.querySelector('input[type=checkbox]').checked;
      if (orig.subtasks[i] && orig.subtasks[i].done !== nowDone)
        await op('subtask_done', id, i, nowDone);
    }
  }

  cache.data = null;
  toast(isNew ? 'Task created' : 'Saved');
  goList(pi);
}

/* ---- live updates: refresh the list view only when idle ---- */
try{
  const ev = new EventSource('/events');
  ev.addEventListener('reload', () => {
    cache.data = null;
    if (route().view !== 'task') render();
  });
}catch(e){ /* no SSE */ }
setInterval(() => { if (route().view !== 'task'){ cache.data = null; render(); } }, 120000);

render();
</script>
