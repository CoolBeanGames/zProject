<!DOCTYPE html>
<html data-zui-theme="holo" lang="en">
<head>
  <meta charset="utf-8">
  <title>zProject</title>
  <link rel="stylesheet" href="../zui/css/zui.css">
  <link rel="stylesheet" href="../zui/css/themes/holo.css">
  <script src="../zui/icons/sprite.js"></script>
  <script src="../zui/js/zui.js"></script>
  <style>
    html, body { overflow: hidden; height: 100%; }
    /* Custom task styles on top of zUI */
    .task-card {
      border-bottom: 1px solid var(--zui-border);
      background: var(--zui-bg-surface);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: flex-start;
      padding: var(--zui-space-2) var(--zui-space-3);
      gap: var(--zui-space-2);
      position: relative;
    }
    .task-card:hover { background: var(--zui-bg-hover); }
    .task-card.selected { background: var(--zui-bg-selected); }
    .task-card.done .task-name { text-decoration: line-through; color: var(--zui-text-secondary); }
    .task-card.indented { margin-left: 20px; }

    .task-done-cb {
      flex-shrink: 0;
      margin-top: 1px;
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: var(--zui-accent);
    }

    .task-body { flex: 1; min-width: 0; }
    .task-id {
      font-size: var(--zui-fs-small);
      color: var(--zui-text-secondary);
      margin-right: var(--zui-space-1);
    }
    .task-name {
      font-size: var(--zui-fs-normal);
      font-weight: var(--zui-fw-normal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
    .chip { font-size: 10px; padding: 1px 5px; border-radius: var(--zui-radius); border: 1px solid var(--zui-border-strong); color: var(--zui-text-secondary); white-space: nowrap; }
    .chip.inprogress { border-color: var(--zui-accent); color: var(--zui-accent); }
    .chip.bug { border-color: var(--zui-error); color: var(--zui-error); }
    .chip.locked { border-color: var(--zui-warn); color: var(--zui-warn); }
    .chip.commit { border-color: #6a7; color: #6a7; }
    .chip.build { border-color: #8a5; color: #8a5; }
    .chip.release { border-color: #a85; color: #a85; }
    .chip.merge { border-color: var(--zui-accent); color: var(--zui-accent); }
    .chip.branch { border-color: #555; color: var(--zui-text-secondary); font-weight: var(--zui-fw-medium); }
    .chip.blocked { border-color: var(--zui-warn); color: var(--zui-warn); }
    .chip.tag { background: var(--zui-bg-raised); }

    .task-subtasks { margin-top: 4px; display: flex; gap: var(--zui-space-1); flex-wrap: wrap; max-height:56px; overflow-y:auto; align-content:flex-start; }
    .subtask-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--zui-text-secondary); }
    .subtask-item input[type=checkbox] { width: 11px; height: 11px; accent-color: var(--zui-accent); cursor: pointer; }
    .subtask-item.done-sub { text-decoration: line-through; opacity: 0.5; }

    .task-actions { display: flex; align-items: center; gap: var(--zui-space-1); flex-shrink: 0; opacity: 0; transition: opacity var(--zui-dur-fast); }
    .task-card:hover .task-actions { opacity: 1; }
    .task-actions button { background: none; border: 1px solid var(--zui-border-strong); color: var(--zui-text-secondary); font: inherit; font-size: 11px; padding: 0 5px; height: 20px; cursor: pointer; border-radius: var(--zui-radius); }
    .task-actions button:hover { background: var(--zui-bg-raised); color: var(--zui-text); border-color: var(--zui-accent); }
    .task-actions button.danger:hover { border-color: var(--zui-error); color: var(--zui-error); }

    .branch-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }

    .drag-handle { color: var(--zui-text-disabled); font-size: 11px; flex-shrink: 0; cursor: grab; padding: 0 2px; opacity: 0; }
    .task-card:hover .drag-handle { opacity: 1; }
    .task-card.dragging { opacity: 0.4; }
    .task-card.drag-over-above { border-top: 2px solid var(--zui-accent); }
    .task-card.drag-over-below { border-bottom: 2px solid var(--zui-accent); }
    .section-header.drag-branch-over { outline: 2px solid var(--zui-accent); outline-offset: -2px; }
    .task-card.priority { background: color-mix(in srgb, var(--zui-error) 24%, var(--zui-bg-surface)); border-color: var(--zui-error); }
    .task-card.note { background: color-mix(in srgb, var(--zui-accent) 9%, var(--zui-bg-surface)); }
    .note-content { margin-top:var(--zui-space-1); color:var(--zui-text-secondary); white-space:pre-wrap; overflow-wrap:anywhere; max-height:5.4em; overflow:auto; padding-right:var(--zui-space-1); }
    .task-card-preview { width:72px; height:52px; flex:0 0 auto; object-fit:cover; border:1px solid var(--zui-border); background:var(--zui-bg-app); }

    #quick-add-bar { display: none; }
    #quick-add-bar.visible { display: flex; }
    #overlay-scrim { display: none; position: fixed; inset: 0; background: var(--zui-scrim); z-index: 10; }
    #overlay-scrim.visible { display: block; }
    #task-form-overlay, #text-editor-overlay { display: none; }
    #task-form-overlay.visible, #text-editor-overlay.visible { display: flex; flex-direction: column; }
    #task-form-overlay { overflow:hidden; }
    #task-form-overlay > .zui-panel__header, #task-form-footer { flex:0 0 auto; }
    #form-body { flex:1 1 0; min-height:0; overflow-y:auto; }
    #text-editor-overlay textarea { flex: 1; resize: none; border: none; background: transparent; color: var(--zui-text); padding: var(--zui-space-3); outline: none; font-family: var(--zui-font-mono); font-size: var(--zui-fs-small); line-height: 1.6; }
    #form-image-preview { display: none; align-self: flex-start; max-width: 100%; padding: 4px; border: 1px solid var(--zui-border); background: var(--zui-bg-app); }
    #form-image-preview.visible { display: block; }
    #form-image-preview img { display: block; max-width: 360px; max-height: 200px; object-fit: contain; }
    .attachment-row { display:flex; align-items:center; gap:var(--zui-space-2); padding:4px 0; border-bottom:1px solid var(--zui-border); }
    .attachment-row img { width:48px; height:36px; object-fit:cover; border:1px solid var(--zui-border); }
    .attachment-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #form-subtask-list { max-height:220px; overflow-y:auto; padding-right:var(--zui-space-1) !important; }
    #form-subtask-list li { display:flex; align-items:center; gap:var(--zui-space-2); flex:0 0 auto; }
    #form-subtask-list .st-text { min-width:0; flex:1; }
    #empty-state { display: none; }
    #empty-state.visible { display: flex; }
    .proj-local-badge { font-size: var(--zui-fs-small); color: var(--zui-text-secondary); float:right; }
    .section-header { display: flex; align-items: center; gap: var(--zui-space-2); padding: var(--zui-space-1) var(--zui-space-3); font-size: var(--zui-fs-small); font-weight: var(--zui-fw-medium); color: var(--zui-label-color); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--zui-accent); background: var(--zui-bg-app); position: sticky; top: 0; z-index: 2; user-select: none; cursor: pointer; }
    .section-header .branch-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .branch-lock-btn { min-width:72px; padding:1px 7px; font-size:var(--zui-fs-small); }
    .section-header .section-count { color: var(--zui-text-secondary); font-weight: var(--zui-fw-normal); margin-left: auto; }
    .section-header .collapse-arrow { color: var(--zui-text-secondary); font-size: 10px; }
</style>
</head>
<body>
<div class="zui-window" id="app">

  <!-- 1. title bar -->
  <div class="zui-titlebar" id="titlebar">
    <span>zProject</span>
    <span class="zui-spacer"></span>
    <span id="status-text" class="zui-text-secondary zui-t-small" style="margin-right:12px">Ready</span>
  </div>

  <!-- 2. application menu -->
  <div class="zui-menubar" id="menubar">
    <div class="zui-menubar__item" id="menu-file">File</div>
    <div class="zui-menubar__item" id="menu-project">Project</div>
    <div class="zui-menubar__item" id="menu-agent">Agent</div>
  </div>

  <!-- 4. workspace -->
  <div class="zui-workspace">
    <nav class="zui-sidebar" style="width:192px">
      <div class="zui-section-label">Projects</div>
      <div id="project-list" class="zui-scroll-y zui-fill zui-list"></div>
      <div style="border-top:1px solid var(--zui-border);padding:8px;display:flex;flex-direction:column;gap:4px">
        <button id="btn-new-project" class="zui-btn zui-justify-start">+ Add Project</button>
        <button id="btn-new-local" class="zui-btn zui-justify-start">+ Local List</button>
        <button id="btn-save-all" class="zui-btn zui-justify-start">Save All</button>
        <button id="btn-web-server" class="zui-btn zui-justify-start">Start Web Server</button>
        <button id="btn-exit" class="zui-btn zui-justify-start">Exit</button>
      </div>
    </nav>
    <div class="zui-fill zui-scroll-y" style="display:flex;flex-direction:column;">
      <!-- Toolbar -->
      <div class="zui-row zui-gap-2 zui-items-center" style="padding:4px 8px;border-bottom:1px solid var(--zui-border);background:var(--zui-bg-surface-alt);flex-shrink:0;">
        <button class="zui-btn zui-btn--primary" id="btn-add-task">+ New Task</button>
        <button class="zui-btn" id="btn-add-note">+ New Note</button>
        <span class="zui-sep--v" style="height:16px"></span>
        <button class="zui-btn" id="btn-deploy-codex">▶ Codex</button>
        <button class="zui-btn" id="btn-deploy-claude">▶ Claude</button>
        <button class="zui-btn" id="btn-deploy-antigravity">▶ Antigravity</button>
        <span class="zui-sep--v" style="height:16px"></span>
        <button class="zui-btn" id="btn-collapse-all">Collapse All</button>
        <button class="zui-btn" id="btn-expand-all">Expand All</button>
        <span class="zui-sep--v" style="height:16px"></span>
        <span class="zui-t-small zui-text-secondary">Branch:</span>
        <select class="zui-input" id="new-task-branch" style="width:130px"
          aria-label="Branch for new tasks"><option value="main">main</option></select>
        <span class="zui-spacer"></span>
        <button class="zui-btn" id="btn-reload">Reload</button>
        <button class="zui-btn" id="btn-export-csv">Export CSV</button>
        <button class="zui-btn" id="btn-import-csv">Import CSV</button>
        <button class="zui-btn" id="btn-open-dir">Open Folder</button>
      </div>

      <!-- Quick-add bar -->
      <div id="quick-add-bar" class="zui-row zui-gap-2 zui-items-center" style="padding:4px 8px;border-bottom:1px solid var(--zui-border);background:var(--zui-bg-surface-alt);flex-shrink:0;">
        <span class="zui-t-small zui-text-secondary">New task:</span>
        <input type="text" class="zui-input zui-fill" id="quick-add-input" placeholder="Task name…">
        <span class="zui-t-small zui-text-secondary">Enter — add · Esc — cancel</span>
      </div>

      <!-- Task scroll area -->
      <div id="task-scroll" class="zui-scroll-y zui-fill" style="position:relative;">
        <div id="empty-state" class="zui-center zui-fill zui-col zui-gap-3" style="color:var(--zui-text-secondary);position:absolute;inset:0;">
          <span>No project selected</span>
          <span class="empty-hint zui-t-small">Choose a project from the sidebar or add one with + Add Project</span>
        </div>
        <div id="task-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Overlay scrim ────────────────────────────────────────────── -->
<div id="overlay-scrim"></div>

<!-- ── Task form overlay ────────────────────────────────────────── -->
<div id="task-form-overlay" class="zui-panel" style="position:fixed;top:0;right:0;bottom:0;width:440px;border-left:1px solid var(--zui-border-strong);z-index:11;">
  <div class="zui-panel__header">
    <span id="form-task-id" class="zui-text-secondary zui-t-small" style="margin-right:8px"></span>
    <span id="form-title" style="flex:1">Task</span>
    <button class="zui-btn" id="form-cancel-btn">✕</button>
  </div>
  <div class="zui-panel__body zui-scroll-y" id="form-body" style="padding:12px;display:flex;flex-direction:column;gap:12px">
    <div class="zui-col zui-gap-1">
      <label class="zui-t-small zui-text-secondary">Name</label>
      <input type="text" class="zui-input" id="form-name" placeholder="Task name">
    </div>
    <div class="zui-col zui-gap-1">
      <label class="zui-t-small zui-text-secondary">Branch</label>
      <select class="zui-input" id="form-branch"><option value="main">main</option></select>
    </div>
    <div class="zui-col zui-gap-1" id="form-flags-group">
      <label class="zui-t-small zui-text-secondary">Flags</label>
      <div class="zui-row zui-gap-2" style="flex-wrap:wrap">
        <label class="zui-check task-only-field"><input type="checkbox" id="form-inprogress"> In Progress</label>
        <label class="zui-check"><input type="checkbox" id="form-done"> Done</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-priority"> Priority</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-bug"> Bug</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-locked"> Locked</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-archived"> Archived</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-commit"> Commit</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-build"> Build</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-release"> Release</label>
        <label class="zui-check task-only-field"><input type="checkbox" id="form-merge"> Merge</label>
      </div>
    </div>
    <div class="zui-col zui-gap-1" id="form-clear-group" style="display:none">
      <label class="zui-check"><input type="checkbox" id="form-note-done"> Done</label>
      <label class="zui-check"><input type="checkbox" id="form-clear-after-reading"> Clear after reading</label>
    </div>
    <div class="zui-col zui-gap-1 task-only-group">
      <label class="zui-t-small zui-text-secondary">Blocked By</label>
      <input type="text" class="zui-input" id="form-blocked-by" placeholder="Task ID" list="form-blockers-list">
      <datalist id="form-blockers-list"></datalist>
    </div>
    <div class="zui-col zui-gap-1 task-only-group">
      <label class="zui-t-small zui-text-secondary">Tags</label>
      <input type="text" class="zui-input" id="form-tags" placeholder="comma-separated tags" list="form-tags-list">
      <datalist id="form-tags-list"></datalist>
    </div>
    <div class="zui-col zui-gap-1">
      <label class="zui-t-small zui-text-secondary" id="form-content-label">Prompt</label>
      <textarea class="zui-textarea" id="form-prompt" placeholder="Task description for the agent…" rows="4"></textarea>
    </div>
    <div class="zui-col zui-gap-1 task-only-group">
      <label class="zui-t-small zui-text-secondary">Requirements</label>
      <textarea class="zui-textarea" id="form-requirements" placeholder="Specific requirements…" rows="3"></textarea>
    </div>
    <div class="zui-col zui-gap-1 task-only-group" id="form-image-group">
      <label class="zui-t-small zui-text-secondary">Attachments</label>
      <div class="zui-row zui-gap-2 zui-items-center">
        <button class="zui-btn" id="form-choose-image" type="button">Choose files…</button>
        <span class="zui-t-small zui-text-secondary" id="form-image-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      </div>
      <div id="form-attachment-list"></div>
    </div>
    <div class="zui-col zui-gap-1 task-only-group" id="form-notes-group">
      <label class="zui-t-small zui-text-secondary">Notes (agent-written)</label>
      <textarea class="zui-textarea" id="form-notes" rows="3"></textarea>
    </div>
    <div class="zui-col zui-gap-1 task-only-group" id="form-files-group">
      <label class="zui-t-small zui-text-secondary">Files Changed (agent-written)</label>
      <textarea class="zui-textarea" id="form-files" rows="2"></textarea>
    </div>
    <div class="zui-col zui-gap-1 task-only-group" id="form-error-group">
      <label class="zui-t-small zui-text-secondary">Error Message</label>
      <textarea class="zui-textarea" id="form-error-msg" rows="2"></textarea>
    </div>
    <div class="zui-col zui-gap-1 task-only-group">
      <label class="zui-t-small zui-text-secondary">Subtasks</label>
      <ul style="list-style:none;display:flex;flex-direction:column;gap:3px;padding:0;margin:0" id="form-subtask-list"></ul>
      <div class="zui-row zui-gap-2">
        <input type="text" class="zui-input zui-fill" id="form-new-subtask" placeholder="New subtask…">
        <button class="zui-btn" id="form-add-subtask">Add</button>
      </div>
    </div>
    <div class="zui-col zui-gap-1 task-only-group">
      <label class="zui-t-small zui-text-secondary">Run with agent</label>
      <div class="zui-row zui-gap-2">
        <button class="zui-btn" id="form-run-codex">▶ Codex</button>
        <button class="zui-btn" id="form-run-claude">▶ Claude</button>
        <button class="zui-btn" id="form-run-antigravity">▶ Antigravity</button>
      </div>
    </div>
  </div>
  <div class="zui-row zui-gap-2" id="task-form-footer" style="padding:8px 12px;border-top:1px solid var(--zui-border);background:var(--zui-bg-surface-alt)">
    <button class="zui-btn" id="form-delete-btn" style="color:var(--zui-error)">Delete</button>
    <span class="zui-spacer"></span>
    <button class="zui-btn" id="form-cancel-btn2">Cancel</button>
    <button class="zui-btn zui-btn--primary" id="form-save-btn">Save</button>
  </div>
</div>

<!-- ── Text editor overlay ──────────────────────────────────────── -->
<div id="text-editor-overlay" class="zui-panel" style="position:fixed;inset:60px 40px;border-radius:var(--zui-radius-lg);box-shadow:var(--zui-shadow-modal);z-index:11;flex-direction:column">
  <div class="zui-panel__header">
    <span id="text-editor-title" style="flex:1">Edit</span>
    <button class="zui-btn" id="text-editor-cancel">✕</button>
  </div>
  <div id="text-editor-subtitle" class="zui-t-small zui-text-secondary" style="padding:2px 12px 4px;border-bottom:1px solid var(--zui-border);background:var(--zui-bg-surface-alt)"></div>
  <textarea id="text-editor-content"></textarea>
  <div class="zui-row zui-gap-2 zui-justify-end" style="padding:8px 12px;border-top:1px solid var(--zui-border);background:var(--zui-bg-surface-alt)">
    <button class="zui-btn" id="text-editor-cancel2">Cancel</button>
    <button class="zui-btn zui-btn--primary" id="text-editor-save">Save</button>
  </div>
</div>

  

<script>
// ════════════════════════════════════════════════════════════
// zProject UI — talks to C# host via zui.send / zui.receive
// ════════════════════════════════════════════════════════════

'use strict';

// ── State ────────────────────────────────────────────────────
let state = {
  projects: [],        // [{id, name, isLocal}]
  selectedProject: null,
  tasks: [],           // TaskItem objects from host
  sections: [],        // [{key, label, tasks}]
  collapsedSections: new Set(),
  knownBranches: ['main'],
  knownTags: [],
  quickAddActive: false,
  formTask: null,      // {isNew, task, blockers, branches, tags} or null
  textEditor: null,    // {title, subtitle, channel, current}
  dragTask: null,
  dragOverTask: null,
  dragAbove: false,
};

// ── Helpers ──────────────────────────────────────────────────
function branchColor(branch) {
  if (!branch || branch.toLowerCase() === 'main') return null;
  let h = 2166136261 >>> 0;
  for (let i = 0; i < branch.length; i++) {
    h ^= branch.toLowerCase().charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return `hsl(${h % 360},55%,52%)`;
}

function taskPriorityGroup(task) {
  if (task.bug) return 0;
  if (task.error) return 1;
  return 2;
}

function sameReorderGroup(a, b) {
  if (!a || !b || a.done || a.archived || b.done || b.archived) return false;
  const aBranch = (a.branch || 'main').trim().toLowerCase();
  const bBranch = (b.branch || 'main').trim().toLowerCase();
  if (aBranch !== bBranch) return true;
  return aBranch === bBranch && !!a.priority === !!b.priority && taskPriorityGroup(a) === taskPriorityGroup(b);
}

function chipHtml(cls, label) {
  return `<span class="chip ${cls}">${label}</span>`;
}

// ── Render ───────────────────────────────────────────────────
function renderProjects() {
    const list = document.getElementById('project-list');
    list.innerHTML = '';
    for (const p of state.projects) {
      const el = document.createElement('div');
      el.className = 'zui-sidebar__item' + (state.selectedProject && p.id === state.selectedProject ? ' zui-active' : '');
      el.dataset.id = p.id;
      el.innerHTML = `<span class="zui-tree__label" style="flex:1" title="${esc(p.name)}">${esc(p.name)}</span>`;
      if (p.isLocal) el.innerHTML += `<span class="proj-local-badge">local</span>`;
      el.addEventListener('click', () => zui.send('select-project', p.id));
      el.addEventListener('contextmenu', e => {
        e.preventDefault();
        showProjectContextMenu(e, p);
      });
      list.appendChild(el);
    }
  }

function showProjectContextMenu(e, p) {
  // Simple inline context menu
  const menu = document.createElement('div');
  menu.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;
    background:var(--zui-bg-raised);border:1px solid var(--zui-border-strong);
    border-radius:var(--zui-radius);z-index:99;min-width:140px;
    box-shadow:var(--zui-shadow-pop);`;
  const items = [
    ['Open Folder', () => zui.send('open-project-dir', p.id)],
    ['Reload', () => zui.send('reload-project', null)],
    ['Remove…', () => zui.send('remove-project', p.id)],
  ];
  if (!p.isLocal) {
    items.unshift(
      ['Edit Prompt…', () => zui.send('edit-local', 'prompt')],
      ['Edit Instructions…', () => zui.send('edit-local', 'instructions')],
      ['Edit Design…', () => zui.send('edit-local', 'design')],
    );
  }
  for (const [label, fn] of items) {
    const btn = document.createElement('button');
    btn.style.cssText = `display:block;width:100%;text-align:left;background:none;border:none;
      color:var(--zui-text);font:inherit;font-size:var(--zui-fs-small);
      padding:5px 12px;cursor:pointer;`;
    btn.textContent = label;
    btn.addEventListener('mouseenter', () => btn.style.background = 'var(--zui-bg-hover)');
    btn.addEventListener('mouseleave', () => btn.style.background = 'none');
    btn.addEventListener('click', () => { fn(); menu.remove(); });
    menu.appendChild(btn);
  }
  document.body.appendChild(menu);
  const close = e2 => { if (!menu.contains(e2.target)) { menu.remove(); document.removeEventListener('mousedown', close); } };
  requestAnimationFrame(() => document.addEventListener('mousedown', close));
}

function buildSections(tasks) {
  const sections = new Map();
  for (const t of tasks) {
    const key = t.sectionKey || 'main';
    if (!sections.has(key)) sections.set(key, []);
    sections.get(key).push(t);
  }
  const result = [];
  for (const [key, tasks] of sections) {
    let label = key;
    if (key === 'Done') label = 'Completed';
    else if (key === 'Archived') label = 'Archived';
    result.push({ key, label, tasks });
  }
  return result;
}

function renderTaskList() {
  const emptyEl = document.getElementById('empty-state');
  const listEl = document.getElementById('task-list');

  if (!state.selectedProject || state.tasks.length === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.add('visible');
    if (state.selectedProject) {
      emptyEl.querySelector('span').textContent = 'No tasks';
      emptyEl.querySelector('.empty-hint').textContent = 'Press Space or click + New Task to add one.';
    } else {
      emptyEl.querySelector('span').textContent = 'No project selected';
      emptyEl.querySelector('.empty-hint').textContent = 'Choose a project from the sidebar.';
    }
    return;
  }
  emptyEl.classList.remove('visible');

  state.sections = buildSections(state.tasks);
  listEl.innerHTML = '';

  for (const section of state.sections) {
    const collapsed = state.collapsedSections.has(section.key);
    const color = branchColor(section.key);

    // Section header
    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.dataset.section = section.key;
    let dotHtml = '';
    if (color) dotHtml = `<span class="branch-dot" style="background:${color}"></span>`;
    const lockable = section.tasks.filter(t => !t.done && !t.archived);
    const allLocked = lockable.length > 0 && lockable.every(t => t.locked);
    const lockHtml = lockable.length > 0
      ? `<button class="zui-btn branch-lock-btn" type="button">${allLocked ? 'Unlock branch' : 'Lock branch'}</button>`
      : '';
    hdr.innerHTML = `
      ${dotHtml}
      <span>${esc(section.label)}</span>
      <span class="section-count">${section.tasks.length}</span>
      ${lockHtml}
      <span class="collapse-arrow">${collapsed ? '▶' : '▼'}</span>`;
    hdr.addEventListener('click', () => toggleSection(section.key));
    const lockButton = hdr.querySelector('.branch-lock-btn');
    if (lockButton) lockButton.addEventListener('click', e => {
      e.stopPropagation();
      zui.send('set-branch-lock', { branch: section.key, locked: !allLocked });
    });
    if (lockable.length > 0) {
      hdr.addEventListener('dragover', e => {
        const source = state.tasks.find(t => t.id === state.dragTask);
        const target = lockable.find(t => t.id !== state.dragTask);
        if (!source || !target || !sameReorderGroup(source, target) ||
            (source.branch || 'main').trim().toLowerCase() === (target.branch || 'main').trim().toLowerCase()) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        hdr.classList.add('drag-branch-over');
      });
      hdr.addEventListener('dragleave', e => {
        if (!hdr.contains(e.relatedTarget)) hdr.classList.remove('drag-branch-over');
      });
      hdr.addEventListener('drop', e => {
        const source = state.tasks.find(t => t.id === state.dragTask);
        const target = lockable.find(t => t.id !== state.dragTask);
        hdr.classList.remove('drag-branch-over');
        if (!source || !target || !sameReorderGroup(source, target) ||
            (source.branch || 'main').trim().toLowerCase() === (target.branch || 'main').trim().toLowerCase()) return;
        e.preventDefault();
        e.stopPropagation();
        zui.send('move-task', { taskId: source.id, targetId: target.id, above: true });
        state.dragTask = null;
      });
    }
    listEl.appendChild(hdr);

    if (collapsed) continue;

    for (const task of section.tasks) {
      listEl.appendChild(renderTaskCard(task, color));
    }
  }
}

function renderTaskCard(task, sectionColor) {
  const card = document.createElement('div');
  card.className = 'task-card' + (task.priority && !task.done && !task.archived ? ' priority' : '') +
    (task.isNote ? ' note' : '') + (task.done ? ' done' : '') + (task.indentLevel > 0 ? ' indented' : '');
  card.dataset.taskId = task.id;
  card.draggable = !task.done && !task.archived;

  const tc = branchColor(task.branch) || sectionColor;

  // Chips
  let chips = '';
  if (!task.isNote) {
    if (task.inProgress) chips += chipHtml('inprogress', 'IN PROGRESS');
    if (task.priority) chips += chipHtml('bug', 'PRIORITY');
    if (task.bug) chips += chipHtml('bug', 'BUG');
    if (task.locked) chips += chipHtml('locked', 'LOCKED');
    if (task.commit) chips += chipHtml('commit', 'COMMIT');
    if (task.build) chips += chipHtml('build', 'BUILD');
    if (task.release) chips += chipHtml('release', 'RELEASE');
    if (task.merge) chips += chipHtml('merge', 'MERGE');
    if (task.isBlocked) chips += chipHtml('blocked', `BLOCKED by ${esc(task.blockedBy)}`);
  }
  if (task.isNote && task.clearAfterReading) chips += chipHtml('inprogress', 'CLEAR AFTER READING');
  if (task.branch && task.branch.toLowerCase() !== 'main')
    chips += chipHtml('branch', esc(task.branch));
  if (task.tags) for (const tag of task.tags) chips += chipHtml('tag', esc(tag));
  if (!task.isNote && task.attachments && task.attachments.length)
    chips += chipHtml('tag', `${task.attachments.length} FILE${task.attachments.length === 1 ? '' : 'S'}`);

  // Subtasks mini-list
  let subtasksHtml = '';
  if (!task.isNote && task.subtasks && task.subtasks.length > 0) {
    subtasksHtml = '<div class="task-subtasks">';
    for (let i = 0; i < task.subtasks.length; i++) {
      const s = task.subtasks[i];
      subtasksHtml += `<span class="subtask-item${s.done ? ' done-sub' : ''}">
        <input type="checkbox" ${s.done ? 'checked' : ''}
          data-task="${task.id}" data-subtask-idx="${i}">
        <span>${esc(s.text)}</span></span>`;
    }
    subtasksHtml += '</div>';
  }

  const barStyle = tc ? `background:${tc}` : '';

  card.innerHTML = `
    <div class="task-row">
      <div class="branch-bar" style="${barStyle}"></div>
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <input type="checkbox" class="task-done-cb" ${task.done ? 'checked' : ''}
        data-task-id="${task.id}" title="Mark done">
      <div class="task-body">
        <div>
          <span class="task-id">${esc(task.id)}</span>
          <span class="task-name">${esc(task.name || '(unnamed)')}</span>
        </div>
        ${chips ? `<div class="task-chips">${chips}</div>` : ''}
        ${task.isNote ? `<div class="note-content">${esc(task.note || '')}</div>` : ''}
        ${subtasksHtml}
      </div>
      <div class="task-actions">
        <button data-action="edit" data-task-id="${task.id}">Edit</button>
        ${!task.isNote ? `<button data-action="lock" data-task-id="${task.id}" title="${task.locked ? 'Unlock' : 'Lock'}">${task.locked ? '🔒' : '🔓'}</button>` : ''}
        ${!task.isNote && !task.isLocal ? `<button data-action="run-codex" data-task-id="${task.id}">▶ Codex</button>
        <button data-action="run-claude" data-task-id="${task.id}">▶ Claude</button>
        <button data-action="run-agy" data-task-id="${task.id}">▶ AGY</button>` : ''}
        <button data-action="delete" data-task-id="${task.id}" class="danger">Del</button>
      </div>
      ${!task.isNote && task.imagePreviewUrl ? `<img class="task-card-preview" src="${task.imagePreviewUrl}" alt="Attached image">` : ''}
    </div>`;

  // Done checkbox
  card.querySelector('.task-done-cb').addEventListener('change', e => {
    e.stopPropagation();
    zui.send('toggle-done', task.id);
  });

  // Subtask checkboxes
  for (const cb of card.querySelectorAll('[data-subtask-idx]')) {
    cb.addEventListener('change', e => {
      e.stopPropagation();
      zui.send('toggle-subtask', { taskId: task.id, index: parseInt(cb.dataset.subtaskIdx), done: cb.checked });
    });
  }

  // Action buttons
  card.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.stopPropagation();
    const action = btn.dataset.action;
    const tid = btn.dataset.taskId;
    if (action === 'edit') zui.send('open-edit-task', tid);
    else if (action === 'lock') zui.send('toggle-lock', tid);
    else if (action === 'delete') zui.send('delete-task', tid);
    else if (action === 'run-codex') zui.send('run-task-with-agent', { taskId: tid, agent: 'codex' });
    else if (action === 'run-claude') zui.send('run-task-with-agent', { taskId: tid, agent: 'claude' });
    else if (action === 'run-agy') zui.send('run-task-with-agent', { taskId: tid, agent: 'agy' });
  });

  // Double-click opens edit
  card.addEventListener('dblclick', e => {
    if (e.target.closest('input, button')) return;
    zui.send('open-edit-task', task.id);
  });

  // Drag-and-drop
  card.addEventListener('dragstart', e => {
    state.dragTask = task.id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', task.id);
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    clearDragOver();
    state.dragTask = null;
  });
  card.addEventListener('dragover', e => {
    if (!state.dragTask || state.dragTask === task.id) return;
    const source = state.tasks.find(t => t.id === state.dragTask);
    if (!source || !sameReorderGroup(source, task)) {
      clearDragOver();
      return;
    }
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = card.getBoundingClientRect();
    const above = e.clientY < rect.top + rect.height / 2;
    if (state.dragOverTask !== task.id || state.dragAbove !== above) {
      clearDragOver();
      state.dragOverTask = task.id;
      state.dragAbove = above;
      card.classList.add(above ? 'drag-over-above' : 'drag-over-below');
    }
  });
  card.addEventListener('dragleave', e => {
    if (!card.contains(e.relatedTarget)) clearDragOver();
  });
  card.addEventListener('drop', e => {
    e.preventDefault();
    if (!state.dragTask || state.dragTask === task.id) return;
    const source = state.tasks.find(t => t.id === state.dragTask);
    if (!source || !sameReorderGroup(source, task)) {
      clearDragOver();
      return;
    }
    const rect = card.getBoundingClientRect();
    const above = e.clientY < rect.top + rect.height / 2;
    clearDragOver();
    zui.send('move-task', { taskId: state.dragTask, targetId: task.id, above });
    state.dragTask = null;
  });

  return card;
}

function clearDragOver() {
  document.querySelectorAll('.drag-over-above,.drag-over-below,.drag-branch-over').forEach(el => {
    el.classList.remove('drag-over-above', 'drag-over-below', 'drag-branch-over');
  });
  state.dragOverTask = null;
  state.dragAbove = false;
}

function toggleSection(key) {
  if (state.collapsedSections.has(key)) state.collapsedSections.delete(key);
  else state.collapsedSections.add(key);
  renderTaskList();
}

  document.getElementById('form-priority').checked = !!data.priority;
  document.getElementById('form-bug').checked = !!data.bug;
  document.getElementById('form-locked').checked = !!data.locked;
  document.getElementById('form-archived').checked = !!data.archived;
  document.getElementById('form-commit').checked = !!data.commit;
  document.getElementById('form-build').checked = !!data.build;
  document.getElementById('form-release').checked = !!data.release;
  document.getElementById('form-merge').checked = !!data.merge;
  document.getElementById('form-blocked-by').value = data.blockedBy || '';
  document.getElementById('form-tags').value = data.tagText || '';
  document.getElementById('form-prompt').value = noteMode ? (data.note || '') : (data.prompt || '');
  document.getElementById('form-clear-after-reading').checked = !!data.clearAfterReading;
  document.getElementById('form-requirements').value = data.requirements || '';
  document.getElementById('form-notes').value = data.notes || '';
  document.getElementById('form-files').value = data.filesChanged || '';
  document.getElementById('form-error-msg').value = data.errorMessage || '';
  updateFormImage(data);

  // Show/hide agent-written sections
  document.querySelectorAll('.task-only-group,.task-only-field').forEach(el => el.style.display = noteMode ? 'none' : '');
  document.getElementById('form-flags-group').style.display = noteMode ? 'none' : '';
  document.getElementById('form-clear-group').style.display = noteMode ? '' : 'none';
  document.getElementById('form-content-label').textContent = noteMode ? 'Note' : 'Prompt';
  document.getElementById('form-prompt').placeholder = noteMode ? 'Information for the agent…' : 'Task description for the agent…';
  document.getElementById('form-notes-group').style.display = !noteMode && data.hasNotes ? '' : 'none';
  document.getElementById('form-files-group').style.display = !noteMode && data.hasFilesChanged ? '' : 'none';
  document.getElementById('form-error-group').style.display = !noteMode && data.hasError ? '' : 'none';

  // Blockers datalist
  const blList = document.getElementById('form-blockers-list');
  blList.innerHTML = (data.blockCandidates || []).map(b => `<option value="${esc(b)}">`).join('');

  // Tags datalist
  const tgList = document.getElementById('form-tags-list');
  tgList.innerHTML = (data.knownTags || []).map(t => `<option value="${esc(t)}">`).join('');

  // Subtasks
  renderFormSubtasks(data.subtasks || []);

  document.getElementById('form-delete-btn').style.display = data.isNew ? 'none' : '';

  // Show overlay
  document.getElementById('overlay-scrim').classList.add('visible');
  document.getElementById('task-form-overlay').classList.add('visible');

}

function updateFormImage(data) {
  if (!state.formTask) return;
  state.formTask.image = data.image || '';
  state.formTask.hasImage = !!data.hasImage;
  state.formTask.imagePreviewUrl = data.imagePreviewUrl || '';
  state.formTask.attachments = data.attachments || [];
  document.getElementById('form-image-name').textContent = state.formTask.attachments.length
    ? `${state.formTask.attachments.length} file(s)` : 'No attachments';
  document.getElementById('form-attachment-list').innerHTML = state.formTask.attachments.map(a => `
    <div class="attachment-row">
      ${a.isImage && a.previewUrl ? `<img src="${a.previewUrl}" alt="">` : ''}
      <span class="attachment-name" title="${esc(a.name)}">${esc(a.name)}</span>
      <button class="zui-btn" type="button" data-remove-attachment="${esc(a.name)}">Remove</button>
    </div>`).join('');
}

function renderFormSubtasks(subtasks) {
  state.formTask.subtasks = subtasks;
  const ul = document.getElementById('form-subtask-list');
  ul.innerHTML = '';
  for (let i = 0; i < subtasks.length; i++) {
    const s = subtasks[i];
    const li = document.createElement('li');
    li.innerHTML = `<input type="checkbox" ${s.done ? 'checked' : ''} data-idx="${i}">
      <input type="text" class="zui-input st-text" value="${esc(s.text)}" aria-label="Subtask text">
      <button class="st-remove" data-idx="${i}">✕</button>`;
    li.querySelector('input').addEventListener('change', ev => {
      state.formTask.subtasks[i].done = ev.target.checked;
    });
    const textInput = li.querySelector('.st-text');
    const previousText = s.text;
    textInput.addEventListener('input', ev => {
      state.formTask.subtasks[i].text = ev.target.value;
    });
    textInput.addEventListener('blur', ev => {
      if (ev.target.value.trim()) return;
      ev.target.value = previousText;
      state.formTask.subtasks[i].text = previousText;
    });
    textInput.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); }
    });
    li.querySelector('.st-remove').addEventListener('click', () => {
      state.formTask.subtasks.splice(i, 1);
      renderFormSubtasks(state.formTask.subtasks);
    });
    ul.appendChild(li);
  }
}

    priority: document.getElementById('form-priority').checked,
    bug: document.getElementById('form-bug').checked,
    locked: document.getElementById('form-locked').checked,

}

    ['Install Codex CLI', () => zui.send('install-cli', 'codex')],
    ['Install Claude CLI', () => zui.send('install-cli', 'claude')],
    ['Install Both', () => zui.send('install-cli', 'both')],
  ]);
});

function showDropMenu(triggerEvent, items) {
  const rect = triggerEvent.currentTarget.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.bottom}px;
    background:var(--zui-bg-raised);border:1px solid var(--zui-border-strong);
    border-radius:var(--zui-radius);z-index:99;min-width:180px;
    box-shadow:var(--zui-shadow-pop);padding:3px 0;`;
  for (const item of items) {
    if (!item || item[0] === null) {
      const sep = document.createElement('div');
      sep.style.cssText = 'height:1px;background:var(--zui-border);margin:3px 0;';
      menu.appendChild(sep);
      continue;
    }
    const [label, fn] = item;
    const btn = document.createElement('button');
    btn.style.cssText = `display:block;width:100%;text-align:left;background:none;border:none;
      color:var(--zui-text);font:inherit;font-size:var(--zui-fs-small);
      padding:4px 16px;cursor:pointer;`;
    btn.textContent = label;
    btn.addEventListener('mouseenter', () => btn.style.background = 'var(--zui-bg-hover)');
    btn.addEventListener('mouseleave', () => btn.style.background = 'none');
    btn.addEventListener('click', () => { fn(); menu.remove(); });
    menu.appendChild(btn);
  }
  document.body.appendChild(menu);
  const close = e => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('mousedown', close); } };
  requestAnimationFrame(() => document.addEventListener('mousedown', close));
}

// Task form buttons
document.getElementById('form-save-btn').addEventListener('click', saveTaskForm);
document.getElementById('form-cancel-btn').addEventListener('click', closeTaskForm);
document.getElementById('form-cancel-btn2').addEventListener('click', closeTaskForm);
document.getElementById('form-delete-btn').addEventListener('click', () => {
  if (state.formTask) zui.send('delete-task', state.formTask.id);
  closeTaskForm();
});
document.getElementById('form-choose-image').addEventListener('click', () => {
  if (state.formTask) zui.send('choose-task-image', null);
});
document.getElementById('form-attachment-list').addEventListener('click', e => {
  const button = e.target.closest('[data-remove-attachment]');
  if (button && state.formTask) zui.send('remove-task-attachment', button.dataset.removeAttachment);
});

// Ctrl+V attaches an image only while a full task editor is open. Normal text
// paste remains untouched in every other field and view.
document.addEventListener('paste', e => {
  if (!state.formTask || state.formTask.isNote) return;
  const item = Array.from(e.clipboardData?.items || []).find(candidate =>
    candidate.kind === 'file' && candidate.type.toLowerCase().startsWith('image/'));
  if (!item) return;

  const file = item.getAsFile();
  if (!file) return;
  e.preventDefault();
  if (file.size > 25 * 1024 * 1024) {
    document.getElementById('status-text').textContent = 'Clipboard images must be 25 MB or smaller.';
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const result = typeof reader.result === 'string' ? reader.result : '';
    const comma = result.indexOf(',');
    if (comma < 0) return;
    zui.send('paste-task-image', {
      name: file.name || 'clipboard-image.png',
      contentType: file.type || 'image/png',
      base64: result.slice(comma + 1),
    });
  };
  reader.readAsDataURL(file);
});
document.getElementById('form-add-subtask').addEventListener('click', () => {
  const input = document.getElementById('form-new-subtask');
  const text = input.value.trim();
  if (!text) return;
  if (!state.formTask.subtasks) state.formTask.subtasks = [];
  state.formTask.subtasks.push({ text, done: false });
  renderFormSubtasks(state.formTask.subtasks);
  input.value = '';
  input.focus();
});
document.getElementById('form-new-subtask').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('form-add-subtask').click();
});
document.getElementById('form-run-codex').addEventListener('click', () => {
  if (state.formTask) zui.send('run-task-with-agent', { taskId: state.formTask.id, agent: 'codex' });
  closeTaskForm();
});
document.getElementById('form-run-claude').addEventListener('click', () => {
  if (state.formTask) zui.send('run-task-with-agent', { taskId: state.formTask.id, agent: 'claude' });
  closeTaskForm();
});
document.getElementById('form-run-antigravity').addEventListener('click', () => {
  if (state.formTask) zui.send('run-task-with-agent', { taskId: state.formTask.id, agent: 'agy' });
  closeTaskForm();
});

// Text editor buttons
document.getElementById('text-editor-save').addEventListener('click', saveTextEditor);
document.getElementById('text-editor-cancel').addEventListener('click', closeTextEditor);
document.getElementById('text-editor-cancel2').addEventListener('click', closeTextEditor);

// Overlay scrim click closes
document.getElementById('overlay-scrim').addEventListener('click', () => {
  if (state.formTask) closeTaskForm();
  if (state.textEditor) closeTextEditor();
});

// Quick-add
document.getElementById('quick-add-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    if (val) zui.send('quick-add-commit', val);
    e.target.value = '';
  } else if (e.key === 'Escape') {
    zui.send('quick-add-cancel', null);
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.key === ' ' && !state.formTask && !state.textEditor) {
    e.preventDefault();
    zui.send('quick-add-begin', null);
  }
  if (e.key.toLowerCase() === 'n' && !state.formTask && !state.textEditor && !state.quickAddActive) {
    e.preventDefault();
    zui.send('add-note', null);
  }
  if (e.key === 'Escape') {
    if (state.formTask) closeTaskForm();
    else if (state.textEditor) closeTextEditor();
    else if (state.quickAddActive) zui.send('quick-add-cancel', null);
  }
});

// ── Host → UI messages ───────────────────────────────────────
zui.receive('projects', data => {
  state.projects = data.projects || [];
  state.selectedProject = data.selectedProject;
  renderProjects();
});

zui.receive('tasks', data => {
  state.tasks = data.tasks || [];
  state.knownBranches = data.knownBranches || ['main'];
  state.knownTags = data.knownTags || [];
  const br = document.getElementById('new-task-branch');
  const currentBranch = data.currentBranch || 'main';
  const branches = Array.from(new Set([...state.knownBranches, currentBranch]));
  br.innerHTML = branches.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
  br.value = currentBranch;
  renderTaskList();
});

zui.receive('status', text => {
  document.getElementById('status-text').textContent = text;
});

zui.receive('open-task-form', data => {
  openTaskForm(data);
});

zui.receive('task-image-state', data => {
  updateFormImage(data);
});

zui.receive('open-text-editor', data => {
  openTextEditor(data);
});

zui.receive('close-overlay', () => {
  closeTaskForm();
  closeTextEditor();
});

zui.receive('quick-add-state', active => {
  state.quickAddActive = !!active;
  const bar = document.getElementById('quick-add-bar');
  if (active) {
    bar.classList.add('visible');
    document.getElementById('quick-add-input').value = '';
    document.getElementById('quick-add-input').focus();
  } else {
    bar.classList.remove('visible');
  }
});

// Signal ready
zui.send('ui-ready', null);
</script>
